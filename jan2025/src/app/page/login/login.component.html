<div class="login-wrapper">
  <form class="login-card" (ngSubmit)="login()">

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your account</p>

    <input
      type="text"
      placeholder="Username or Email"
      [(ngModel)]="usernameOrEmail"
      name="username"
      required
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <!-- CAPTCHA -->
    <div class="captcha-box">
      <span class="captcha-text">{{ generatedCaptcha }}</span>
      <button type="button" (click)="generateCaptcha()">↻</button>
    </div>

    <input
      type="text"
      placeholder="Enter Captcha"
      [(ngModel)]="captchaInput"
      name="captcha"
      required
    />

    <!-- ERROR MESSAGE -->
    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <button type="submit">Login</button>

    <!-- SIGNUP LINK -->
    <p class="signup-text">
      New user?
      <a routerLink="/signup">Create an account</a>
    </p>

  </form>
</div>
